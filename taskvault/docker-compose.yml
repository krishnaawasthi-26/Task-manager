services:
  postgres:
    image: postgres:15-alpine
    container_name: taskvault-postgres
    environment:
      POSTGRES_DB: taskvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskvault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: taskvault-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taskvault
      DB_USER: postgres
      DB_PASSWORD: postgres
      JPA_DDL: create-drop
      JWT_ACCESS_SECRET: taskvault-docker-access-secret-minimum-32-characters
      JWT_REFRESH_SECRET: taskvault-docker-refresh-secret-minimum-32-characters
      FRONTEND_URL: http://localhost:5173
      ADMIN_EMAIL: admin@taskvault.dev
      ADMIN_PASSWORD: Admin@123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: taskvault-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  taskvault_postgres_data:
