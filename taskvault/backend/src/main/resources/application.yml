spring:
  application:
    name: taskvault
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskvault}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL:create-drop}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:your-very-long-access-secret-min-32-chars-here}
    refresh-secret: ${JWT_REFRESH_SECRET:your-very-long-refresh-secret-min-32-chars-here}
    access-expiry-ms: 900000
    refresh-expiry-ms: 604800000
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@taskvault.dev}
    admin-password: ${ADMIN_PASSWORD:Admin@123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

logging:
  level:
    com.taskvault: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${SQL_LOG:OFF}
  file:
    name: logs/taskvault.log
